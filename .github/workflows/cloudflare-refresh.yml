name: Price source diagnostics and manual refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Connectivity and header tests do not modify user data
        type: choice
        default: connectivity
        options: [connectivity, headers, refresh, full-refresh, retry-errors]

permissions:
  contents: read

concurrency:
  group: cloudflare-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Compare request headers
        if: inputs.mode == 'headers'
        run: node cloudflare/scripts/header_matrix.mjs
      - name: Check public product price and stock
        if: inputs.mode == 'connectivity'
        run: node cloudflare/scripts/refresh_prices.mjs --probe
      - name: Refresh tracked prices manually
        if: inputs.mode == 'refresh' || inputs.mode == 'full-refresh' || inputs.mode == 'retry-errors'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          REFRESH_MODE: ${{ inputs.mode }}
        run: |
          case "$REFRESH_MODE" in
            full-refresh) node cloudflare/scripts/refresh_prices.mjs --all ;;
            retry-errors) node cloudflare/scripts/refresh_prices.mjs --retry-errors ;;
            *) node cloudflare/scripts/refresh_prices.mjs ;;
          esac
