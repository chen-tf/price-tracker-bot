name: Refresh prices on Cloudflare

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Check public momo connectivity without reading or changing user data
        type: boolean
        default: false
      header_probe:
        description: Compare public HTTP headers from one runner
        type: boolean
        default: false
      browser_probe:
        description: Diagnose public pages using headless Chromium
        type: boolean
        default: false
      runner:
        description: Standard free runner for public repository
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, macos-latest, windows-latest]

permissions:
  contents: read

concurrency:
  group: cloudflare-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compare request headers
        if: inputs.header_probe
        run: node cloudflare/scripts/header_matrix.mjs
      - name: Install diagnostic browser
        if: inputs.browser_probe
        run: |
          npm install --prefix cloudflare --no-save playwright
          cd cloudflare
          npx playwright install --with-deps chromium
      - name: Diagnose browser connectivity
        if: inputs.browser_probe
        run: node cloudflare/scripts/probe_browser.mjs
      - name: Check momo connectivity
        if: inputs.probe && !inputs.browser_probe && !inputs.header_probe
        run: node cloudflare/scripts/refresh_prices.mjs --probe
      - name: Refresh tracked prices
        if: ${{ !inputs.probe && !inputs.browser_probe && !inputs.header_probe && !inputs.header_probe }}
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: node cloudflare/scripts/refresh_prices.mjs
