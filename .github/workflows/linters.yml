name: Python lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIPENV_VENV_IN_PROJECT: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pipenv
      - run: python -m pip install pipenv==2026.11.0
      - run: pipenv sync --dev
      - name: Check Python formatting and errors
        run: |
          git ls-files -z '*.py' | xargs -0 pipenv run black --check
          git ls-files -z '*.py' | xargs -0 pipenv run isort --check-only
          git ls-files -z '*.py' | xargs -0 pipenv run pylint --errors-only
