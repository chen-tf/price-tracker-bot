name: Python

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIPENV_VENV_IN_PROJECT: '1'
      PYTHON_DOTENV_DISABLED: '1'
      BOT_TOKEN: '123456789:fake-test-token-for-offline-tests'
      DB_HOST: localhost
      DB_NAME: test
      DB_USER: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pipenv
      - run: python -m pip install pipenv==2026.11.0
      - run: pipenv sync --dev
      - run: pipenv run pytest tests -v
      - run: pipenv run pip-audit
