services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./postgres-data-18:/var/lib/postgresql
      - ./sqls/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql:ro
